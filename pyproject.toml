[project]
name = "leafguardai"
version = "0.1.0"
description = "Classificador de doenças em folhas de plantas com EfficientNet-B0"
readme = "README.md"
authors = [
    { name = "Justo", email = "justomlo@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "google-genai>=2.27.0",
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.scripts]
leafguardai = "leafguardai.__main__:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# PyTorch com CUDA no Windows e no Linux (no macOS, o PyPI já tem a versão certa).
# Sem GPU NVIDIA, esta versão também funciona na CPU.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
